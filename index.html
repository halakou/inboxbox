<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InboxBox</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <p class="kicker">InboxBox</p>
    <h1>Shelf</h1>
    <p class="lede">Forward to the bot. Files stay in Telegram. We keep file_id only.</p>
  </header>
  <main>
    <section>
      <h2>Boxes</h2>
      <div class="grid">
        <button data-cmd="box:Work">Work</button>
        <button data-cmd="box:Ideas">Ideas</button>
        <button data-cmd="box:Links">Links</button>
        <button data-cmd="box:Later">Later</button>
      </div>
    </section>
    <section>
      <h2>Actions</h2>
      <div class="row">
        <button data-cmd="list">Open</button>
        <button data-cmd="move">Move</button>
        <button data-cmd="delete">Delete</button>
      </div>
    </section>
    <p class="note">Use the bot chat for save and Open. VIP is 149 Stars, once.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
