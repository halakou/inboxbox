<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>InboxBox</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css?v=super1">
</head>
<body>
  <div id="skel" class="skel"></div>
  <div id="app" hidden>
    <header class="top">
      <div class="who">
        <div id="avatar" class="avatar">I</div>
        <div>
          <p id="uname" class="name">InboxBox</p>
          <p id="plan" class="plan">Free</p>
        </div>
      </div>
    </header>
    <nav class="tabs">
      <button data-view="shelf" class="on">Shelf</button>
      <button data-view="sources">Sources</button>
      <button data-view="settings">Settings</button>
    </nav>
    <section id="view-shelf">
      <h1>Shelf</h1>
      <p class="section-label">Boxes</p>
      <div id="boxes" class="list"></div>
      <p class="section-label">Recent</p>
      <div id="recent" class="list"></div>
      <div id="pinned-wrap" hidden>
        <p class="section-label">Pinned</p>
        <div id="pinned" class="list"></div>
      </div>
      <div class="list" style="margin-top:16px">
        <button class="row" id="go-sources"><span class="title">Sources</span><span class="chev">›</span></button>
      </div>
      <p class="hint">Forward a file</p>
    </section>
    <section id="view-box" hidden>
      <div class="filters">
        <button data-filter="all" class="on">All</button>
        <button data-filter="files">Files</button>
        <button data-filter="text">Text</button>
        <button data-filter="recent">Recent</button>
        <button data-filter="pinned">Pinned</button>
      </div>
      <input id="q" type="search" placeholder="Search" autocomplete="off">
      <h1 id="box-title">Box</h1>
      <div id="files" class="list"></div>
      <p id="box-empty" class="hint" hidden>Forward a file</p>
    </section>
    <section id="view-sources" hidden>
      <h1>Sources</h1>
      <div id="sources" class="list"></div>
      <p id="src-empty" class="hint">Channels you forward from</p>
    </section>
    <section id="view-settings" hidden>
      <h1>Settings</h1>
      <div class="list">
        <div class="row static"><span class="title">Plan</span><span id="set-plan" class="meta">Free</span></div>
        <div class="row static"><span class="title">Agreed</span><span class="meta">Yes</span></div>
        <button class="row" id="btn-pro"><span class="title">Pro</span><span class="meta">149 Stars</span><span class="chev">›</span></button>
        <button class="row" id="btn-privacy"><span class="title">Privacy</span><span class="chev">›</span></button>
        <button class="row" id="btn-erase"><span class="title">Delete all</span><span class="chev">›</span></button>
      </div>
    </section>
  </div>
  <script src="app.js?v=super1"></script>
</body>
</html>
